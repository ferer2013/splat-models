<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3DGS Viewer - Aholo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #viewer { width: 100%; height: 100%; }
    #loading {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: white; font-size: 18px; font-family: sans-serif; z-index: 10;
      background: rgba(0,0,0,0.7); padding: 16px 32px; border-radius: 8px;
    }
    #info {
      position: fixed; bottom: 16px; right: 16px;
      color: rgba(255,255,255,0.5); font-size: 12px; font-family: sans-serif; z-index: 10;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-NVFXInnc.js"></script>
</head>
<body>
  <div id="viewer"></div>
  <div id="loading">加载中...</div>
  <div id="info">Aholo (+Z up)</div>
</body>
</html>
